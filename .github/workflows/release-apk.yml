name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: stillness-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Stillness.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$SDK/licenses"
          curl -fsSL -o /tmp/commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/commandlinetools.zip -d /tmp
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --install "platforms;android-36.1" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Generate debug keystore if missing
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Prepare Stillness.apk
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Stillness.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose Stillness.apk
          ls -lh Stillness.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stillness
          path: Stillness.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="apk-${GITHUB_SHA::12}"
          NOTES=$(cat <<EOF
          Installable debug-signed Android APK from commit ${GITHUB_SHA}.

          On a phone, download Stillness.apk. If Android blocks the install, allow installation from this source, then grant Stillness Usage access (Settings → Apps → Special app access → Usage access).

          Stable link: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Stillness.apk

          Weekly suggestions in this build are sample text. Live Gemini coaching needs Firebase, which is not configured here.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Stillness.apk --clobber
            gh release edit "$TAG" --latest --notes "$NOTES"
          else
            gh release create "$TAG" Stillness.apk \
              --title "Stillness ${TAG}" \
              --notes "$NOTES" \
              --latest
          fi
